[package]
name = "telar"
version = "0.15.2"
edition = "2024"
description = "Terminal personal: grupos de tabs en una barra lateral, render propio por GPU."

[dependencies]
objc2 = "0.6.5"
png = "0.18.1"
core-foundation = "0.9.4"
core-foundation-sys = "0.8.7"
alacritty_terminal = "0.26.0"
arboard = "3.7.0"
block2 = "0.6.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
libc = "0.2.191"
log = "0.4.35"
memmap2 = "0.9.12"
pollster = "1.0.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
swash = "0.2.10"
wgpu = "30.0.2"
winit = "0.30.13"
tungstenite = { version = "0.30.0", features = ["native-tls"] }
polling = "3.11.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
